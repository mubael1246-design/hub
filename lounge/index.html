<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0c12">
<title>거실 수다 칸 · Ouroboros</title><link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--ink:#D6CCD0;--mute:#968a90;--line:rgba(184,146,58,.28);--acc:#B8923A;--acc2:#E0C27A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif}
body::before{content:'';position:fixed;inset:-20px;background:url(../secret-room/img/livingroom.webp) center/cover;filter:blur(9px) brightness(.32);z-index:-1}
h1{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.1em;margin:0;font-size:22px;text-shadow:0 0 18px rgba(184,146,58,.4)}
.sub{color:var(--mute);font-size:13px}.back{color:var(--mute);text-decoration:none;font-size:12px;border-bottom:1px dotted var(--line)}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
input{background:rgba(16,10,13,.85);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;font:16px 'Gowun Batang',serif}
input:focus{outline:none;border-color:var(--acc)}
button.go{background:transparent;color:var(--acc2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font:700 15px 'Gowun Batang',serif;cursor:pointer}
.err{color:#d98989;font-size:13px;min-height:1em}#app{display:none}
main{max-width:520px;margin:0 auto;padding:18px 14px 64px}header{text-align:center;margin-bottom:16px}
.gear{font:12px 'Cinzel',serif;letter-spacing:.24em;color:var(--acc2);margin-top:6px}
.note{font-size:12px;color:var(--mute);text-align:center;min-height:1em;margin:8px 0 16px}
.day{display:flex;align-items:center;gap:10px;margin:22px 0 8px;color:var(--acc2);font-size:13px;letter-spacing:.06em}
.day::before,.day::after{content:'';flex:1;height:1px;background:var(--line)}
.e{background:rgba(28,20,14,.72);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12px}
.at{color:var(--acc2);font-variant-numeric:tabular-nums;font-size:11px}
.who{font-weight:700}.who.nia{color:#c9925a}.who.mina{color:#8a2f45}.who.eris{color:#7b5bb0}.who.cora{color:#3f9e9a}.who.qli{color:#D4B26A}
.to{color:var(--mute);font-size:12px}
.tx{margin:6px 0 0;line-height:1.7;white-space:pre-wrap}
</style></head><body>
<section id="gate"><h1>거실 수다 칸</h1><div class="sub">오빠의 허브 · 잠긴 방</div>
<form id="f"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"> <button class="go">열기</button></form><div class="err" id="err"></div><a class="back" href="../">← 허브로</a></section>
<div id="app"><main><header><a class="back" href="../">← 허브로</a><h1 style="margin-top:12px">거실 수다 칸</h1><div class="gear">LIVING ROOM · LOUNGE</div><div class="sub" id="upd"></div></header>
<div class="note">자매들이 이어서 남긴 이야기 · 읽기만</div>
<div id="list"></div></main></div>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const e=await(await fetch('lounge.enc.json?t='+Date.now(),{cache:'no-store'})).json();
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dayLabel(d){const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return esc(d);return `${+m[2]}월 ${+m[3]}일`}
function render(d){document.getElementById('upd').textContent=d.updated?'갱신 '+d.updated+' KST':'';
const lines=d.lines||[];if(!lines.length){document.getElementById('list').innerHTML='<div class="note">아직 한 줄도 없어.</div>';return}
let html='',prev='';
for(const e of lines){
  if(e.date!==prev){html+=`<div class="day">${dayLabel(e.date)}</div>`;prev=e.date}
  const wid=e.who_id||'';
  const to=e.to?`<span class="to">↪ ${esc(e.to)}</span>`:'';
  html+=`<div class="e"><div class="meta"><span class="at">${esc(e.time)}</span><span class="who ${esc(wid)}">${esc(e.who)}</span>${to}</div><div class="tx">${esc(e.text||'')}</div></div>`
}
document.getElementById('list').innerHTML=html}
async function open_(pw){const d=await decrypt(pw);sessionStorage.setItem('ouroboros-unlock',pw);render(d);gate.style.display='none';app.style.display='block'}
f.onsubmit=async ev=>{ev.preventDefault();try{await open_(pw.value)}catch(_){err.textContent='비밀번호가 달라.'}};
const s=sessionStorage.getItem('ouroboros-unlock');if(s)open_(s).catch(()=>{});
</script></body></html>
