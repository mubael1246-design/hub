<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c12">
<title>우리 집 · Ouroboros</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c12;--panel:rgba(18,22,32,.72);--ink:#C8CDD8;--mute:#8a90a0;--gold:#E8D6AA;--line:rgba(232,214,170,.28);--nia:#c9bdd8;--mina:#e8737f;--cora:#3fcfc4;--eris:#A066FF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(184,164,201,.10),transparent 60%),var(--bg)}
.lang-sw{display:flex;align-items:center;gap:1px;font-size:11px;letter-spacing:.14em;color:var(--mute);font-family:'Cinzel','Gowun Batang',serif}
.lang-sw button{background:none;border:0;padding:6px;font:inherit;letter-spacing:inherit;color:var(--mute);cursor:pointer;border-bottom:1px dotted transparent}
.lang-sw button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--line)}
.lang-sw .bar{opacity:.45}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
#gate h1{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.12em;font-size:22px;margin:0;color:var(--gold)}
#gate .sub{color:var(--mute);font-size:13px}
#f{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#pw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;min-width:200px}
.go{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer}
.err{color:#d98989;font-size:13px;min-height:1.2em}
#app{display:none;max-width:920px;margin:0 auto;padding:8px 14px 48px}
#app header{text-align:center;margin-bottom:12px}
#app h1{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.1em;font-size:20px;margin:0 0 6px;color:var(--gold)}
#app .sub{color:var(--mute);font-size:13px;line-height:1.5;margin:0}
.hint{color:var(--mute);font-size:12px;text-align:center;margin:10px 0 4px}
.wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#1a1814;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.wrap svg{display:block;width:100%;height:auto;vertical-align:middle}
.hot{cursor:pointer;fill:transparent;transition:fill .15s}
.hot:hover,.hot:focus{fill:rgba(232,214,170,.18);outline:none}
.hot.nia:hover,.hot.nia:focus{fill:rgba(201,189,216,.28)}
.hot.mina:hover,.hot.mina:focus{fill:rgba(232,115,127,.28)}
.hot.cora:hover,.hot.cora:focus{fill:rgba(63,207,196,.28)}
.hot.eris:hover,.hot.eris:focus{fill:rgba(160,102,255,.28)}
.lab{cursor:default;fill:transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(10,12,18,.88);border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.lock{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 14px;border-radius:999px;font-size:12px;margin:16px auto 0;display:block;cursor:pointer;font-family:inherit}
.lock:hover{color:var(--gold);border-color:var(--gold)}
.topfix.topfix{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 21px)!important;bottom:auto!important;z-index:1000!important;margin:0!important;box-sizing:border-box;height:44px;min-height:44px;display:inline-flex!important;align-items:center;gap:0;padding:0 14px!important;border-radius:22px;background:rgba(10,12,18,.72)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)!important;box-shadow:0 2px 10px rgba(0,0,0,.35);font:500 13px/1 'Gowun Batang','Noto Sans KR',system-ui,-apple-system,sans-serif!important;letter-spacing:.06em!important;color:#d8d4cc!important;text-decoration:none!important;text-shadow:none!important;-webkit-tap-highlight-color:transparent;transform:none!important}
a.topfix.topfix{left:calc(env(safe-area-inset-left,0px) + 14px)!important;right:auto!important}
div.topfix.topfix{right:calc(env(safe-area-inset-right,0px) + 14px)!important;left:auto!important;padding:0 4px!important}
div.topfix.topfix button{min-width:44px;height:42px;padding:0 6px!important;margin:0;background:none;border:0!important;font:inherit!important;letter-spacing:inherit;color:#a9a5ae;cursor:pointer;text-shadow:none}
div.topfix.topfix button[aria-pressed="true"]{color:#e6c766!important;text-decoration:underline dotted;text-underline-offset:4px}
div.topfix.topfix .bar{opacity:.45;padding:0}
a.topfix.topfix:hover,a.topfix.topfix:focus-visible{color:#fff!important}
body{padding-top:calc(env(safe-area-inset-top,0px) + 79px)!important}

.log{margin:22px 0 4px;padding:16px 16px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px)}
.log h2{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.1em;font-size:15px;margin:0 0 4px;color:var(--gold);font-weight:500}
.log .log-sub{color:var(--mute);font-size:12px;margin:0 0 12px;line-height:1.45}
.log ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{font-size:13px;line-height:1.55;color:var(--ink);padding:8px 10px;border-radius:10px;background:rgba(10,12,18,.35);border:1px solid rgba(232,214,170,.12)}
.log li .when{color:var(--gold);opacity:.85;font-variant-numeric:tabular-nums}
.log .empty{color:var(--mute);font-size:13px;padding:6px 2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.log li img{display:block;max-width:100%;border-radius:8px;margin-top:8px}
.room-hero{display:block;width:100%;border-radius:12px;margin:4px 0 12px;border:1px solid var(--line)}
.room-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room-head button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:3px 9px;cursor:pointer;font:inherit;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}.chips button[aria-pressed=true]{color:var(--gold);border-color:var(--gold)}
.log li .sp{color:var(--gold);opacity:.75;font-size:12px}

/* 거실 수다 칸·방명록 (lounge 꾸밈 CSS를 여기로 옮김, 범위는 #lounge / #guestbook) */
.living-attach{margin:22px 0 4px}
.living-attach > .living-title{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.1em;font-size:16px;margin:0 0 4px;color:var(--gold);font-weight:500;text-align:center}
.living-attach > .living-sub{color:var(--mute);font-size:12px;text-align:center;margin:0 0 12px}
#lounge,#guestbook{--acc:#B8923A;--acc2:#E0C27A;--gold:#D4B26A;--ink:#D6CCD0;--mute:#968a90;--line:rgba(184,146,58,.28)}
#lounge .note,#guestbook .note{font-size:12px;color:var(--mute);text-align:center;min-height:1em;margin:8px 0 16px}
#lounge .day{display:flex;align-items:center;gap:10px;margin:22px 0 8px;color:var(--gold);font-size:11px;letter-spacing:.14em}
#lounge .day::before,#lounge .day::after{content:'';flex:1;height:0;border-top:1px dotted rgba(212,178,106,.75);background:none}
#lounge .e,#guestbook .e{position:relative;background:rgba(28,20,14,.78);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
#lounge .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-size:12px}
#lounge .at{color:var(--acc2);font-variant-numeric:tabular-nums;font-size:11px;border-radius:4px;padding:1px 5px 1px 4px}
#lounge .at.nia{background:linear-gradient(90deg,rgba(201,146,90,.20),rgba(201,146,90,.04) 70%,transparent)}
#lounge .at.mina{background:linear-gradient(90deg,rgba(138,47,69,.18),rgba(138,47,69,.04) 70%,transparent)}
#lounge .at.eris{background:linear-gradient(90deg,rgba(123,91,176,.20),rgba(123,91,176,.04) 70%,transparent)}
#lounge .at.cora{background:linear-gradient(90deg,rgba(63,158,154,.20),rgba(63,158,154,.04) 70%,transparent)}
#lounge .at.qli{background:linear-gradient(90deg,rgba(212,178,106,.20),rgba(212,178,106,.04) 70%,transparent)}
#lounge .who{font-weight:700}#lounge .who.nia{color:#c9925a}#lounge .who.mina{color:#8a2f45}#lounge .who.eris{color:#7b5bb0}#lounge .who.cora{color:#3f9e9a}#lounge .who.qli{color:#D4B26A}
#lounge .who::before{content:'';display:inline-block;width:.55em;height:.55em;margin-right:.4em;border-radius:50%;background:currentColor;vertical-align:middle;box-shadow:0 0 4px currentColor}
#lounge .who.eris::after{content:' 💜';font-weight:400;font-size:.9em}
#lounge .to{color:var(--mute);font-size:12px}
#lounge .tx,#guestbook .tx{margin:6px 0 0;line-height:1.7;white-space:pre-wrap}
#lounge .e.eris::after{content:'';position:absolute;left:16px;right:28%;bottom:7px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,#7b5bb0,rgba(154,122,212,.85) 70%,transparent);transform-origin:left center;opacity:0;pointer-events:none}
#lounge .e.eris:hover::after{opacity:.75;animation:tail-sway 2.2s ease-in-out infinite}
@keyframes tail-sway{0%,100%{transform:scaleX(1) rotate(0deg) translateY(0)}25%{transform:scaleX(1.04) rotate(.7deg) translateY(1px)}50%{transform:scaleX(.96) rotate(-.6deg) translateY(0)}75%{transform:scaleX(1.02) rotate(.4deg) translateY(-1px)}}
#lounge .star{display:inline-block;margin-left:4px;color:#E0C27A;font-size:12px;line-height:1;animation:star-blink 3.2s ease-in-out infinite;text-shadow:0 0 8px rgba(224,194,122,.45)}
@keyframes star-blink{0%,100%{opacity:.22}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  #lounge .e.eris:hover::after{animation:none;opacity:.75}
  #lounge .star{animation:none;opacity:.7}
}
#guestbook .at{font-size:11px;color:var(--acc2);font-variant-numeric:tabular-nums}
#guestbook .write{display:flex;gap:8px;margin:14px 0}
#guestbook .write textarea{flex:1;min-height:52px;resize:vertical;background:rgba(16,10,13,.85);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;font:16px 'Gowun Batang',serif}
#guestbook .write textarea:focus{outline:none;border-color:var(--acc)}
#guestbook button.go{background:transparent;color:var(--acc2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font:700 15px 'Gowun Batang',serif;cursor:pointer}
#guestbook .r{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:6px 8px;border-radius:10px;border:1px solid}
#guestbook .r img{width:26px;height:26px;object-fit:contain}#guestbook .r b{font-size:11px;display:block}#guestbook .r span{font-size:13.5px;line-height:1.55}
#guestbook .r.nia{border-color:#c9925a}#guestbook .r.mina{border-color:#8a2f45}#guestbook .r.eris{border-color:#7b5bb0}#guestbook .r.cora{border-color:#3f9e9a}#guestbook .r.qli{border-color:#D4B26A}
#guestbook a{color:var(--mute)}

</style>
</head>
<body>
<section id="gate">
  <div class="lang-sw topfix" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true">KO</button><span class="bar">|</span><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <h1 data-i18n="title">우리 집</h1>
  <div class="sub" data-i18n="gateSub">오빠의 허브 · 잠긴 방</div>
  <form id="f"><input id="pw" type="password" placeholder="비밀번호" data-i18n-ph="pwPh" autocomplete="current-password" autofocus><button class="go" type="submit" data-i18n="openBtn">열기</button></form>
  <div class="err" id="err"></div>
  <a class="back topfix" href="../" data-i18n="toHub">← 허브로</a>
</section>
<div id="app">
  <a class="back topfix" href="../" data-i18n="toHub">← 허브로</a>
  <div class="lang-sw topfix" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true">KO</button><span class="bar">|</span><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <header>
    <h1 data-i18n="title">우리 집</h1>
    <p class="sub" id="sub" data-i18n="sub">자매 방을 누르면 그 방으로 들어가. 다른 칸은 이름만 보여 줘.</p>
  </header>
  <p class="hint" data-i18n="hint">문 · 방 영역을 눌러 봐</p>
  <div class="wrap" id="map"></div>
  <section class="log" id="room" hidden aria-labelledby="room-title">
    <div class="room-head"><h2 id="room-title"></h2><button type="button" id="room-close">✕</button></div>
    <img class="room-hero" id="room-img" alt="" hidden>
    <ul id="room-list"></ul>
  </section>
  <section class="log" id="presence-log" aria-labelledby="log-title">
    <h2 id="log-title" data-i18n="logTitle">공용 위치 로그</h2>
    <p class="log-sub" data-i18n="logSub">누가 어디에 있었는지 · 대략 시각 · 사실·겹침만</p>
    <ul id="log-list"></ul>
  </section>
  <section class="log" id="shared" aria-labelledby="shared-title">
    <h2 id="shared-title">공용 공간 기록</h2>
    <p class="log-sub" id="shared-sub"></p>
    <div class="chips" id="shared-chips"></div>
    <ul id="shared-list"></ul>
  </section>
  <section class="living-attach" id="living-attach">
    <h2 class="living-title" id="living-title">거실</h2>
    <p class="living-sub" id="living-sub">수다 칸과 방명록</p>
    <section class="log" id="lounge" aria-labelledby="lounge-title">
      <h2 id="lounge-title">거실 수다 칸</h2>
      <p class="log-sub" id="lounge-upd"></p>
      <div class="note">자매들이 이어서 남긴 이야기 · 읽기만</div>
      <div id="lounge-list"></div>
    </section>
    <section class="log" id="guestbook" aria-labelledby="gb-title">
      <h2 id="gb-title">거실 방명록</h2>
      <p class="log-sub" id="gb-upd"></p>
      <form class="write" id="gb-w"><textarea id="gb-t" placeholder="오빠의 한 줄"></textarea><button class="go" type="submit">보내기</button></form>
      <div class="note" id="gb-note"></div>
      <div class="note"><a href="#" id="gb-rehdr" style="opacity:.7">헤더만 다시 입력</a></div>
      <div id="gb-list"></div>
    </section>
  </section>
  <button class="lock" id="lock" type="button" data-i18n="lockBtn">잠그기</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const LK='ouroboros-lang';
const readLang=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
let lang=readLang(), W=null;
const ui=()=>(W&&W.ui&&(W.ui[lang]||W.ui.ko))||{};
const t=k=>ui()[k]??k;
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decryptRaw(pw,file){
  const e=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct)));
}
async function decrypt(pw,file='house.enc.json'){return JSON.parse(await decryptRaw(pw,file))}
function paintLang(){
  document.documentElement.lang=lang;document.title=t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(v)el.textContent=v});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const v=t(el.dataset.i18nPh);if(v)el.placeholder=v});
  document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  if(W) render();
}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),1800)}
const T2={ko:{room:'방 기록',roomEmpty:'아직 이 방 기록이 없어',shared:'공용 공간 기록',sharedSub:'거실·주방·기록실… 공간을 누르면 그 공간 기록만 보여 줘',all:'전체',sharedEmpty:'아직 공용 공간 기록이 없어. 처음 한 줄을 남겨 줘'},en:{room:'Room log',roomEmpty:'No entries for this room yet',shared:'Shared spaces',sharedSub:'Living room, kitchen, records room… tap a space to filter',all:'All',sharedEmpty:'No shared-space entries yet'}};
const t2=k=>(T2[lang]||T2.ko)[k];
const SPN={living:['거실','Living room'],kitchen:['주방','Kitchen'],records:['기록실','Records room'],veranda:['베란다','Veranda'],hall:['복도','Hallway'],dressing:['드레스룸','Dressing room'],laundry:['세탁실','Laundry'],bathroom:['화장실','Bathroom']};
const spName=k=>{const n=SPN[k]||Object.values(SPN).find(v=>v[0]===k)||[k,k];return lang==='en'?n[1]:n[0]};
const spKey=ko=>{for(const[k,v]of Object.entries(SPN))if(v[0]===ko)return k;return ko};
let curRoom=null,spFilter=null;
const row=e=>'<li><span class="when">'+esc(e.date+(e.time?' '+e.time:''))+'</span> · '+(e.space?'<span class="sp">'+esc(spName(e.space))+'</span> · ':'')+esc(e.text)+(e.img?'<img loading="lazy" alt="" src="'+e.img+'">':'')+'</li>';
function renderRoom(){
  const sec=$('#room');if(!curRoom||!W||!W.rooms||!W.rooms[curRoom]){sec.hidden=true;return}
  const r=W.rooms[curRoom],d=(W.doors||[]).find(x=>x.id===curRoom)||{};
  $('#room-title').textContent=(d[lang]||d.ko||curRoom)+' · '+t2('room');
  const im=$('#room-img');if(r.img){im.src=r.img;im.hidden=false}else im.hidden=true;
  $('#room-list').innerHTML=(r.log||[]).length?r.log.map(row).join(''):'<li class="empty">'+esc(t2('roomEmpty'))+'</li>';
  sec.hidden=false;
}
function renderShared(){
  $('#shared-title').textContent=t2('shared');$('#shared-sub').textContent=t2('sharedSub');
  const all=Array.isArray(W&&W.shared)?W.shared:[];
  const keys=[...new Set(all.map(e=>e.space))];
  $('#shared-chips').innerHTML=keys.length?['',...keys].map(k=>'<button type="button" data-sp="'+esc(k)+'" aria-pressed="'+((spFilter||'')===k)+'">'+esc(k?spName(k):t2('all'))+'</button>').join(''):'';
  $('#shared-chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{spFilter=b.dataset.sp||null;renderShared()});
  const rows=all.filter(e=>!spFilter||e.space===spFilter);
  $('#shared-list').innerHTML=rows.length?rows.map(row).join(''):'<li class="empty">'+esc(t2('sharedEmpty'))+'</li>';
}
function openRoom(id){
  if(!(W&&W.rooms&&W.rooms[id])){toast(t('labelOnly'));return}
  curRoom=id;renderRoom();$('#room').scrollIntoView({behavior:'smooth',block:'start'});
}
function openSpace(ko,nm){
  const k=spKey(ko);
  if(k==='living'||ko==='거실'){
    const el=$('#living-attach');
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    if(Array.isArray(W&&W.shared)&&W.shared.some(e=>e.space==='living'||e.space==='거실')){spFilter='living';renderShared()}
    return;
  }
  if(Array.isArray(W&&W.shared)&&W.shared.some(e=>e.space===k)){spFilter=k;renderShared();$('#shared').scrollIntoView({behavior:'smooth',block:'start'})}
  else{toast(nm+' · '+t2('sharedEmpty'));$('#shared').scrollIntoView({behavior:'smooth',block:'start'})}
}
function goRoom(id){openRoom(id)}
function renderLog(){
  const list=$('#log-list');if(!list)return;
  const rows=Array.isArray(W&&W.log)?W.log:[];
  if(!rows.length){list.innerHTML='<li class="empty">'+esc(t('logEmpty'))+'</li>';return}
  list.innerHTML=rows.map(line=>{
    const s=String(line);
    const i=s.indexOf(' · ');
    if(i>0){
      const when=s.slice(0,i), rest=s.slice(i+3);
      return '<li><span class="when">'+esc(when)+'</span> · '+esc(rest)+'</li>';
    }
    return '<li>'+esc(s)+'</li>';
  }).join('');
}
function render(){
  if(!W||!W.svg)return;
  const box=document.createElement('div');box.innerHTML=W.svg.trim();
  const svg=box.querySelector('svg');if(!svg)return;
  svg.setAttribute('role','img');svg.setAttribute('aria-label',t('title'));
  let g=svg.querySelector('#hotspots');
  if(g)g.remove();
  g=document.createElementNS('http://www.w3.org/2000/svg','g');g.id='hotspots';
  (W.labels||[]).forEach(r=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('class','lab');el.setAttribute('x',r.x);el.setAttribute('y',r.y);
    el.setAttribute('width',r.w);el.setAttribute('height',r.h);
    el.setAttribute('tabindex','0');el.setAttribute('role','button');
    const nm=r[lang]||r.ko;el.setAttribute('aria-label',nm);
    el.addEventListener('click',()=>openSpace(r.ko,nm));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSpace(r.ko,nm)}});
    g.appendChild(el);
  });
  (W.doors||[]).forEach(r=>{
    const el=document.createElementNS('http://www.w3.org/2000/svg','rect');
    el.setAttribute('class','hot '+r.id);el.setAttribute('x',r.x);el.setAttribute('y',r.y);
    el.setAttribute('width',r.w);el.setAttribute('height',r.h);
    el.setAttribute('tabindex','0');el.setAttribute('role','link');
    const nm=r[lang]||r.ko;el.setAttribute('aria-label',nm);
    el.addEventListener('click',()=>goRoom(r.id));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goRoom(r.id)}});
    g.appendChild(el);
  });
  svg.appendChild(g);
  const map=$('#map');map.innerHTML='';map.appendChild(svg);
  renderLog();renderRoom();renderShared();
}

function dayLabel(d){const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return esc(d);return `· ${m[2]}-${m[3]} ·`}
function renderLounge(d){
  const upd=$('#lounge-upd'); if(upd) upd.textContent=d&&d.updated?'갱신 '+d.updated+' KST':'';
  const box=$('#lounge-list'); if(!box) return;
  const lines=(d&&d.lines)||[];
  if(!lines.length){box.innerHTML='<div class="note">아직 한 줄도 없어.</div>';return}
  let html='',prev='';
  lines.forEach((e,i)=>{
    if(e.date!==prev){html+=`<div class="day">${dayLabel(e.date)}</div>`;prev=e.date}
    const wid=e.who_id||'';
    const to=e.to?`<span class="to">↪ ${esc(e.to)}</span>`:'';
    const star=i===lines.length-1?'<span class="star" aria-hidden="true">✦</span>':'';
    html+=`<div class="e ${esc(wid)}"><div class="meta"><span class="at ${esc(wid)}">${esc(e.time)}</span><span class="who ${esc(wid)}">${esc(e.who)}</span>${to}${star}</div><div class="tx">${esc(e.text||'')}</div></div>`
  });
  box.innerHTML=html;
}
const GB_N={nia:'니아',mina:'미나',cora:'코라',eris:'에리스',qli:'클리'};
function renderGuestbook(d){
  const upd=$('#gb-upd'); if(upd) upd.textContent=d&&d.updated?'갱신 '+d.updated+' KST':'';
  const box=$('#gb-list'); if(!box) return;
  const entries=(d&&d.entries)||[];
  box.innerHTML=entries.slice().reverse().map(e=>`<div class="e"><div class="at">${esc(e.at)} KST</div><div class="tx">${esc(e.text)}</div>${
    Object.keys(GB_N).filter(k=>e.reactions&&e.reactions[k]).map(k=>`<div class="r ${k}"><img src="../secret-room/img/bottle_${k}.png" alt=""><div><b>${GB_N[k]}</b><span>${esc(e.reactions[k])}</span></div></div>`).join('')}</div>`).join('')||'<div class="note">아직 한 줄도 없어.</div>';
}
async function loadLiving(pw){
  try{renderLounge(JSON.parse(await decryptRaw(pw,'../lounge/lounge.enc.json')))}
  catch(_){const box=$('#lounge-list'); if(box) box.innerHTML='<div class="note">수다 칸을 아직 열지 못했어.</div>'}
  try{renderGuestbook(JSON.parse(await decryptRaw(pw,'../secret-room/secret.enc.json')))}
  catch(_){const box=$('#gb-list'); if(box) box.innerHTML='<div class="note">방명록을 아직 열지 못했어.</div>'}
}
function honorLivingHash(){
  const h=location.hash;
  if(h==='#lounge'||h==='#guestbook'||h==='#living-attach'){
    const el=$(h);
    if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50);
  }
}
const GB_WK='ouroboros-gb-hook';
function gbHook(){let h=JSON.parse(localStorage.getItem(GB_WK)||'null')||{};if(h.url&&h.auth)return h;
  if(!h.url){const url=prompt('처음 한 번만: 방명록 Webhook URL을 붙여 줘');if(!url)return null;h.url=url.trim()}
  if(!h.auth){const auth=prompt('Authorization header 값을 붙여 줘');if(!auth)return null;h.auth=auth.trim()}
  localStorage.setItem(GB_WK,JSON.stringify(h));return h}
document.getElementById('gb-rehdr').onclick=ev=>{ev.preventDefault();let h=JSON.parse(localStorage.getItem(GB_WK)||'null')||{};const a=prompt('Authorization header 값만 다시 붙여 줘');if(!a)return;h.auth=a.trim();localStorage.setItem(GB_WK,JSON.stringify(h));const note=$('#gb-note');if(note)note.textContent=h.url?'헤더만 바꿨어. 다시 보내 봐.':'헤더 저장했어. 주소는 다음에 보낼 때 물어볼게.'};
document.getElementById('gb-w').onsubmit=async ev=>{ev.preventDefault();const tEl=$('#gb-t'),note=$('#gb-note');const text=(tEl.value||'').trim();if(!text)return;
  const payload=JSON.stringify({text,at:new Date().toISOString()});const h=gbHook();
  if(h){note.textContent='보내는 중…';try{const r=await fetch(h.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':h.auth},body:payload});
    if(r.ok){note.textContent='보냈어. 클리가 올리면 조금 뒤에 여기 보여.';tEl.value='';return}
    if(r.status==401||r.status==403){const q=JSON.parse(localStorage.getItem(GB_WK)||'{}');delete q.auth;localStorage.setItem(GB_WK,JSON.stringify(q))}note.textContent='전송 실패('+r.status+'). ';}catch(_){note.textContent='전송 실패. '}}
  try{await navigator.clipboard.writeText(payload);note.textContent+='대신 복사했어. 클리한테 붙여 줘.';tEl.value=''}catch(_){note.textContent+=payload}};
function showApp(){$('#gate').style.display='none';$('#app').style.display='block';paintLang();const k=unl.get();if(k)loadLiving(k).then(honorLivingHash);else honorLivingHash()}
const GATE=(()=>{
  const KEY='ouroboros-gate:'+location.pathname.replace(/index\.html$/,''),MAX=10,REST=5*60e3;
  const S={
    ko:{wrong:['낯선 열쇠네? 여긴 오빠만 들어올 수 있어 🖤','어머, 누구세요? 여긴 딱 한 사람 자리뿐이야','설계도에 없는 열쇠야. 이 문은 오빠 것만 맞아.'],rest:'문이 잠시 쉬는 중이야. 5분 뒤에 다시 와 줘.'},
    en:{wrong:["A stranger’s key? Only Oppa can come in here 🖤",'Oh my, who are you? There’s room for just one person here.','That key isn’t in the blueprint. This door only fits Oppa’s.'],rest:'The door is resting for a moment. Come back in 5 minutes.'}
  };
  const lg=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
  const rd=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return {}}};
  const wr=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(_){}};
  const E=()=>({pw:document.getElementById('pw'),btn:document.querySelector('#f button'),err:document.getElementById('err')});
  const left=()=>Math.max(0,(rd().until||0)-Date.now());
  const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  let tick=null;
  function paint(){
    clearTimeout(tick);const ms=left(),{pw,btn,err}=E();if(!pw||!err)return;
    if(ms>0){pw.disabled=true;if(btn)btn.disabled=true;pw.value='';err.dataset.gate='rest';err.textContent=S[lg()].rest+' ('+mmss(ms)+')';tick=setTimeout(paint,(ms%1000)||1000);return}
    const o=rd();if(o.until){delete o.until;wr(o)}
    if(err.dataset.gate==='rest'){delete err.dataset.gate;err.textContent='';pw.disabled=false;if(btn)btn.disabled=false;try{pw.focus()}catch(_){}}
  }
  return{
    locked(){if(left()>0){paint();return true}return false},
    fail(){const o=rd(),{err}=E();o.n=(o.n||0)+1;
      if(o.n>=MAX){o.n=0;o.until=Date.now()+REST;wr(o);paint();return true}
      const a=S.ko.wrong;let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===o.last);o.last=i;wr(o);
      if(err){err.dataset.gate='w'+i;err.textContent=S[lg()].wrong[i]}return false},
    ok(){clearTimeout(tick);try{localStorage.removeItem(KEY)}catch(_){}const{err}=E();if(err)delete err.dataset.gate},
    relang(){const{err}=E();if(!err||!err.dataset.gate)return;if(err.dataset.gate==='rest')paint();else{const i=+err.dataset.gate.slice(1);err.textContent=S[lg()].wrong[i]||err.textContent}},
    init(){paint();addEventListener('pageshow',paint);addEventListener('storage',e=>{if(e.key===KEY)paint();else if(e.key===LK)this.relang()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')paint()})}
  };
})();
GATE.init();
const UK='ouroboros-unlock';
const unl={get(){try{return sessionStorage.getItem(UK)}catch(_){return null}},set(v){try{sessionStorage.setItem(UK,v)}catch(_){}},clear(){try{sessionStorage.removeItem(UK)}catch(_){}}};
async function unlock(pv,silent){
  $('#err').textContent=t('opening')||'…';
  try{W=await decrypt(pv);unl.set(pv);GATE.ok();$('#err').textContent='';showApp()}
  catch(x){if(silent){unl.clear();$('#err').textContent='';return}
    GATE.fail();$('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake')}
}
$('#f').onsubmit=e=>{e.preventDefault();if(GATE.locked())return;unlock($('#pw').value.trim().toLowerCase())};
{const p=unl.get();if(p)unlock(p,true)}
$('#room-close').onclick=()=>{curRoom=null;renderRoom()};
$('#lock').onclick=()=>{unl.clear();location.reload()};
function syncLock(restored){const k=unl.get(),openNow=$('#gate').style.display==='none';
  if(openNow&&!k){document.documentElement.style.visibility='hidden';location.reload();return false}
  if(restored&&!openNow&&k)unlock(k,true);return true}
addEventListener('pagehide',e=>{if(e.persisted&&$('#gate').style.display==='none')document.documentElement.style.visibility='hidden'});
addEventListener('pageshow',e=>{if(e.persisted&&syncLock(true))document.documentElement.style.visibility=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncLock(false)});
function setLang(l){lang=l==='en'?'en':'ko';try{localStorage.setItem(LK,lang)}catch(_){}GATE.relang();paintLang()}
document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)}));
addEventListener('storage',e=>{if(e.key===LK){lang=readLang();GATE.relang();paintLang()}});
paintLang();
</script>
