<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ouroboros">
<title>Ouroboros · 오빠의 허브</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c12; --panel:rgba(18,22,32,.72); --ink:#C8CDD8; --mute:#8a90a0;
  --gold:#E8D6AA; --lilac:#B8A4C9; --line:rgba(232,214,170,.28);
  --nia:#c9bdd8; --mina:#e8737f; --cora:#3fcfc4;
  --ok:#7dcea0; --bad:#d98989; --unk:#6b7280;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 500px at 50% -10%,rgba(184,164,201,.10),transparent 60%),
  radial-gradient(700px 400px at 90% 110%,rgba(232,214,170,.05),transparent 55%),
  var(--bg)}

/* lock-screen CSS vines only — never the art */
.vine{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.45}
.vine path{fill:none;stroke:var(--lilac);stroke-width:1;opacity:.55}
.vine .leaf{fill:var(--lilac);opacity:.7}
.vine .ink{stroke:rgba(200,205,216,.35)}

#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;position:relative;z-index:1}
/* 잠금 화면 가운데 원: 오빠 손글씨 세 자매 원 4겹 (같은 중심, 겹마다 방향·속도 다름. 아래→위 L4 OUROBOROS, L3 코라, L2 미나, L1 니아·시나) */
.ring{position:relative;flex:none;width:min(300px,72vw,36vh);aspect-ratio:1/1;margin:-4px 0 -2px;pointer-events:none;user-select:none}
.ring img{position:absolute;inset:0;width:100%;height:100%;display:block;transform-origin:50% 50%;animation:spin 80s linear infinite;will-change:transform;-webkit-user-drag:none}
.ring .c1{animation-duration:80s}
.ring .c2{animation-duration:53.333s;animation-direction:reverse}
.ring .c3{animation-duration:40s;animation-direction:reverse}
.ring .c4{animation-duration:106.667s;animation-direction:reverse}
@media (max-height:700px){.ring{width:min(240px,64vw,32vh)}}
@media (max-height:520px){.ring{width:min(180px,30vh)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
h1.title{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.22em;margin:0;font-size:26px;color:var(--ink);text-shadow:0 0 18px rgba(184,164,201,.25)}
h1.title .alch{font-family:'Gowun Batang',serif;letter-spacing:0;margin-left:8px;color:var(--lilac);font-size:.85em;font-weight:400}
.morse{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;letter-spacing:2.4px;color:var(--gold);opacity:.7;margin-top:-4px}
.sub{color:var(--mute);font-size:14px}
/* 잠금 화면: 오빠 손글씨 세 자매 이름 (상아색, 아주 옅게) */
.gate-hand{display:block;width:min(72vw,320px);height:auto;aspect-ratio:960/507;opacity:.24;margin:-2px 0 -6px;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 0 6px rgba(232,214,170,.15))}
@media (max-height:700px){.gate-hand{width:min(58vw,230px);margin:-6px 0 -10px}}
@media (max-height:520px){.gate-hand{display:none}}
form{display:flex;gap:8px;margin-top:6px}
input[type=password]{background:rgba(14,16,24,.85);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;font-size:16px;width:200px;font-family:inherit;text-align:center;letter-spacing:.2em}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,214,170,.12)}
button.go{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
button.go:hover{border-color:var(--gold);background:rgba(232,214,170,.08);color:#f3e6c4}
.err{color:#d98989;font-size:13px;min-height:1em}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* 잠금 화면 아래 공개 페이지 작은 링크 (잠금 없이 열림) */
.gate-links{display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12px;letter-spacing:.08em}
.gate-links a{color:var(--mute);text-decoration:none;padding:6px 4px;border-bottom:1px dotted var(--line);transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.gate-links a:hover,.gate-links a:focus-visible{color:var(--gold);border-color:var(--gold);outline:none}
.gate-links .sep{color:var(--line);align-self:center}
@media (min-height:600px){.gate-links{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));margin-top:0}}

/* app — art as faint inverted background */
#app{display:none;position:relative;z-index:1;min-height:100vh}
.art-layer{position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;
  filter:invert(1) hue-rotate(250deg) saturate(1.15) brightness(.95);
  opacity:.16}
.art-vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(10,12,18,.55) 75%,rgba(10,12,18,.92) 100%)}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:22px 16px 72px}

header{text-align:center;margin:8px 0 18px}
header .band{position:relative;height:88px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;
  background-color:rgba(14,16,24,.4);background-size:cover;background-position:center;
  filter:none}
header .band::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,12,18,.15),rgba(10,12,18,.72));
  /* invert only the bg image via blend: we set art as separate layer inside */
}
header .band-art{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:invert(1) hue-rotate(250deg) saturate(1.2) brightness(1);
  opacity:.38}
header .band-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.25),rgba(10,12,18,.7))}
header .band-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;
  font-family:'Cinzel',serif;letter-spacing:.28em;font-size:13px;color:var(--gold);opacity:.9}

.summary{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:18px;font-size:14px}
.summary .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.dots{display:flex;gap:5px;justify-content:center;margin:4px 0 16px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--lilac);opacity:.55;display:block}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;margin:0 0 12px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-left:2.5px solid color-mix(in srgb,var(--c,var(--lilac)) 55%,transparent);
  transition:border-color .2s,background .2s}
.card:hover{border-color:color-mix(in srgb,var(--gold) 70%,var(--line));background:rgba(22,26,38,.78)}
.card .leaf{position:absolute;top:14px;left:12px;width:10px;height:6px;border-radius:50%;
  background:var(--lilac);opacity:.75;transform:rotate(-30deg);box-shadow:0 0 6px rgba(184,164,201,.35)}
.card .top{display:flex;align-items:flex-start;gap:10px;padding-left:14px}
.card h2{margin:0;font-size:17px;font-weight:700;color:var(--ink);line-height:1.35;flex:1}
.card h2 a{color:inherit;text-decoration:none;border-bottom:1px dotted transparent;transition:color .2s,border-color .2s}
.card h2 a:hover{color:#e8ecf4;border-bottom-color:var(--gold)}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);flex:none;margin-top:3px}
.live .led{width:8px;height:8px;border-radius:50%;background:var(--s,var(--unk));box-shadow:0 0 7px var(--s,var(--unk))}
.desc{margin:8px 0 0;padding-left:14px;font-size:13.5px;color:var(--mute);line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:12px;padding-left:14px;align-items:center;font-size:12px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:rgba(10,12,18,.35)}
.chip .sw{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.85}
.lock-chip{color:var(--gold)}
.meta a{color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--line);transition:color .2s}
.meta a:hover{color:var(--gold)}
.updated{font-variant-numeric:tabular-nums}

/* 사용량 절감 모드 — 작은 상태 칩 (상아·잉크·보라 잎 톤) */
.savings{display:none;align-items:center;justify-content:center;gap:7px;margin:10px auto 0;padding:5px 12px;width:fit-content;max-width:92%;
  border-radius:999px;border:1px solid rgba(184,164,201,.32);background:rgba(18,22,32,.45);
  color:var(--mute);font-size:12px;letter-spacing:.04em;line-height:1.3}
.savings.on{display:inline-flex}
.savings .leaf-dot{width:6px;height:6px;border-radius:50%;background:var(--lilac);opacity:.8;box-shadow:0 0 6px rgba(184,164,201,.4);flex:none}
.savings .n{color:var(--lilac);font-variant-numeric:tabular-nums}
header .savings{margin-top:12px;margin-bottom:2px}

footer{text-align:center;color:var(--mute);font-size:12px;margin-top:28px;opacity:.85}
footer .sig{color:var(--lilac);margin:0 4px}
footer button.sig{background:none;border:0;padding:4px 6px;margin:0;font:inherit;line-height:1;cursor:pointer;border-radius:50%;transition:text-shadow .3s,color .3s;-webkit-tap-highlight-color:transparent}
footer button.sig:hover,footer button.sig:focus-visible{outline:none;color:#cdbbe0;text-shadow:0 0 8px rgba(184,164,201,.55)}
/* 언어 전환 KO | EN — 허브·자매 소개·모스 키보드 공통 선택 (localStorage ouroboros-lang) */
.lang-sw{display:flex;align-items:center;gap:1px;font-size:11px;letter-spacing:.14em;color:var(--mute);font-family:'Cinzel','Gowun Batang',serif}
.lang-sw button{background:none;border:0;padding:6px 6px;font:inherit;letter-spacing:inherit;color:var(--mute);cursor:pointer;border-bottom:1px dotted transparent;transition:color .2s,border-color .2s;-webkit-tap-highlight-color:transparent}
.lang-sw button:hover,.lang-sw button:focus-visible{color:var(--ink);outline:none}
.lang-sw button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--line)}
.lang-sw .bar{opacity:.45}
#gate .lang-sw{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
header .lang-sw{justify-content:flex-end;margin:-14px -4px 4px 0}
input[type=password]:disabled,button.go:disabled{opacity:.45;cursor:not-allowed}
.lock{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 14px;border-radius:999px;font-size:12px;margin-top:12px;cursor:pointer;font-family:inherit;font-weight:400;transition:color .2s,border-color .2s}
.lock:hover{color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>

<svg class="vine" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path class="ink" d="M40 0 C80 80 10 160 55 240 S90 400 35 500 S70 680 40 900"/>
  <path d="M40 0 C80 80 10 160 55 240 S90 400 35 500 S70 680 40 900"/>
  <path class="ink" d="M360 0 C320 90 390 170 345 260 S310 420 365 530 S330 720 360 900"/>
  <path d="M360 0 C320 90 390 170 345 260 S310 420 365 530 S330 720 360 900"/>
  <g class="leaf"><ellipse cx="62" cy="110" rx="7" ry="3.5" transform="rotate(-35 62 110)"/><ellipse cx="28" cy="230" rx="7" ry="3.5" transform="rotate(30 28 230)"/><ellipse cx="68" cy="370" rx="7" ry="3.5" transform="rotate(-25 68 370)"/><ellipse cx="30" cy="540" rx="7" ry="3.5" transform="rotate(40 30 540)"/><ellipse cx="60" cy="700" rx="7" ry="3.5" transform="rotate(-30 60 700)"/><ellipse cx="338" cy="140" rx="7" ry="3.5" transform="rotate(35 338 140)"/><ellipse cx="372" cy="300" rx="7" ry="3.5" transform="rotate(-30 372 300)"/><ellipse cx="340" cy="480" rx="7" ry="3.5" transform="rotate(25 340 480)"/><ellipse cx="370" cy="650" rx="7" ry="3.5" transform="rotate(-40 370 650)"/></g>
</svg>

<section id="gate">
  <div class="lang-sw" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true" lang="ko">KO</button><span class="bar" aria-hidden="true">|</span><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div>
  <div class="ring" aria-hidden="true">
    <img class="c4" src="assets/circle/l4.webp?v=1" width="1024" height="1024" alt="" decoding="async" draggable="false">
    <img class="c3" src="assets/circle/l3.webp?v=1" width="1024" height="1024" alt="" decoding="async" draggable="false">
    <img class="c2" src="assets/circle/l2.webp?v=1" width="1024" height="1024" alt="" decoding="async" draggable="false">
    <img class="c1" src="assets/circle/l1.webp?v=1" width="1024" height="1024" alt="" decoding="async" draggable="false">
  </div>
  <h1 class="title">OUROBOROS<span class="alch">🜸</span></h1>
  <div class="morse">--- ..- .-. --- -... --- .-. --- ...</div>
  <img class="gate-hand" src="sisters-names.webp?v=1" width="960" height="507" alt="" aria-hidden="true" decoding="async">
  <div class="sub" data-i18n="gateSub">오빠의 허브</div>
  <form id="f"><input id="pw" type="password" placeholder="비밀번호" data-i18n-ph="pwPh" autocomplete="current-password" autofocus><button class="go" type="submit" data-i18n="openBtn">열기</button></form>
  <div class="err" id="err"></div>
  <nav class="gate-links" aria-label="공개 페이지" data-i18n-aria="gateLinksAria"><a href="https://mubael1246-design.github.io/nia-sisters/" data-i18n="sisters">세자매 소개</a><span class="sep" aria-hidden="true">·</span><a href="https://mubael1246-design.github.io/nia-morse/" data-i18n="morse">모스 키보드</a></nav>
</section>

<div id="app">
  <div class="art-layer" id="artBg"></div>
  <div class="art-vignette"></div>
  <main>
    <header>
      <div class="lang-sw" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true" lang="ko">KO</button><span class="bar" aria-hidden="true">|</span><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div>
      <div class="band"><div class="band-art" id="artBand"></div><div class="band-veil"></div><div class="band-label">TREEOBOROS</div></div>
      <h1 class="title">OUROBOROS<span class="alch">🜸</span></h1>
      <div class="morse">--- ..- .-. --- -... --- .-. --- ...</div>
      <div class="sub" id="sub"></div>
      <div class="savings" id="savingsApp" hidden aria-live="polite"><span class="leaf-dot" aria-hidden="true"></span><span class="txt"></span></div>
    </header>
    <div class="summary" id="sum"><span class="dot" style="--c:var(--unk)"></span><span data-i18n="checking">확인 중…</span></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="list"></div>
    <section id="nook" hidden></section>
    <footer><span data-i18n="footLine">끝은 다시 시작으로</span><button class="sig" id="sig" type="button" aria-label="🜸">🜸</button><br><button class="lock" id="lock" type="button" data-i18n="lockBtn">잠그기</button></footer>
  </main>
</div>

<script>
/* 사용량 절감 모드 — on/off 와 시작일(KST 달력)만 바꾸면 됨. OFF 면 배지 숨김 */
const SAVINGS_MODE={on:true, startDate:'2026-10-07'};
function savingsDayCount(){
  if(!SAVINGS_MODE.on||!SAVINGS_MODE.startDate) return null;
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}); // YYYY-MM-DD
  const [ys,ms,ds]=SAVINGS_MODE.startDate.split('-').map(Number);
  const [yt,mt,dt]=today.split('-').map(Number);
  if(!ys||!yt) return null;
  const days=Math.round((Date.UTC(yt,mt-1,dt)-Date.UTC(ys,ms-1,ds))/86400000)+1; // 시작일=1일째
  return days>=1?days:null;
}
function paintSavings(){
  const n=savingsDayCount();
  const label=n==null?'':t('savings').replace('{n}',`<span class="n">${n}</span>`);
  const el=document.getElementById('savingsApp'); if(!el) return;
  if(n==null){el.classList.remove('on');el.hidden=true;el.querySelector('.txt').innerHTML='';return}
  el.querySelector('.txt').innerHTML=label;
  el.hidden=false; el.classList.add('on');
}

/* 이중언어 (기본 ko). 선택은 자매 소개·모스 키보드와 같은 localStorage 키(ouroboros-lang)에 저장돼서 한 번 고르면 세 페이지 같이 바뀌어 */
const LANG={
  ko:{
    gateSub:'오빠의 허브',
    pwPh:'비밀번호',
    openBtn:'열기',
    opening:'여는 중…',
    wrongPw:'비밀번호가 달라.',
    sisters:'세자매 소개',
    morse:'모스 키보드',
    gateLinksAria:'공개 페이지',
    docTitle:'Ouroboros · 오빠의 허브',
    checking:'확인 중…',
    checkingPages:'페이지 상태 확인 중…',
    allOk:'모두 괜찮아 · {n}개 페이지',
    someBad:'{b}개 문제 · {g}개 정상',
    live:'접속됨', dead:'응답 없음', probing:'확인 중',
    locked:'잠금', public:'공개', updated:'갱신',
    footLine:'끝은 다시 시작으로',
    lockBtn:'잠그기',
    savings:'절감 모드 · {n}일째'
  },
  en:{
    gateSub:"Oppa’s Hub",
    pwPh:'Password',
    openBtn:'Open',
    opening:'Opening…',
    wrongPw:'Wrong password.',
    sisters:'Three Sisters',
    morse:'Morse Keyboard',
    gateLinksAria:'Public pages',
    docTitle:"Ouroboros · Oppa’s Hub",
    checking:'Checking…',
    checkingPages:'Checking pages…',
    allOk:'All good · {n} pages',
    someBad:'{b} with issues · {g} OK',
    live:'Online', dead:'No response', probing:'Checking',
    locked:'Locked', public:'Public', updated:'Updated',
    footLine:'Every end is a new beginning',
    lockBtn:'Lock',
    savings:'Savings mode · day {n}'
  }
};
const LK='ouroboros-lang';
const readLang=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
let lang=readLang();
function t(k){const L=LANG[lang]||LANG.ko; return L[k]??LANG.ko[k]??k}
function paintGateLang(){
  const L=LANG[lang]||LANG.ko;
  document.documentElement.lang=lang;
  document.title=t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(k in L) el.textContent=L[k]});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.getAttribute('data-i18n-ph'); if(k in L) el.placeholder=L[k]});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{const k=el.getAttribute('data-i18n-aria'); if(k in L) el.setAttribute('aria-label',L[k])});
  document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}
paintGateLang();
paintSavings();

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decrypt(pw,file='data.enc.json'){
  const e=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const KST=9*3600e3, pad=n=>String(n).padStart(2,'0');
function fmtKST(iso){
  if(!iso) return '—';
  const d=new Date(new Date(iso).getTime()+KST);
  return `${d.getUTCFullYear()}.${pad(d.getUTCMonth()+1)}.${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} KST`;
}
let D=null, statuses={};

async function probe(url){
  // try CORS GET/HEAD first; fall back to no-cors (opaque = reachable)
  try{
    const r=await fetch(url,{method:'HEAD',mode:'cors',cache:'no-store',signal:AbortSignal.timeout(8000)});
    return r.ok||(r.status>=200&&r.status<500);
  }catch(_){}
  try{
    const r=await fetch(url,{method:'GET',mode:'cors',cache:'no-store',signal:AbortSignal.timeout(8000)});
    return r.ok||(r.status>=200&&r.status<500);
  }catch(_){}
  try{
    await fetch(url,{method:'GET',mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(8000)});
    return true; // opaque response reached the host
  }catch(_){ return false }
}
async function lastCommit(repo, path){
  try{
    let u=`https://api.github.com/repos/${repo}/commits?per_page=1`;
    if(path) u+=`&path=${encodeURIComponent(path)}`;
    const r=await fetch(u,{headers:{'Accept':'application/vnd.github+json'},signal:AbortSignal.timeout(8000)});
    if(!r.ok) return null;
    const j=await r.json();
    return j[0]?.commit?.committer?.date || j[0]?.commit?.author?.date || null;
  }catch(_){ return null }
}

function renderCards(){
  const makers=D.makers||{};
  $('#list').innerHTML=D.pages.map(p=>{
    const m=makers[p.maker]||{ko:p.maker,color:'var(--lilac)'};
    const st=statuses[p.id]||{};
    const live=st.live; const led=live===true?'var(--ok)':live===false?'var(--bad)':'var(--unk)';
    const liveT=live===true?t('live'):live===false?t('dead'):t('probing');
    return `<article class="card" style="--c:${m.color}">
      <span class="leaf" aria-hidden="true"></span>
      <div class="top"><h2><a href="${esc(p.url)}"${p.locked?'':' target="_blank" rel="noopener"'}>${esc(p.name)}</a></h2>
        <div class="live" title="${liveT}"><span class="led" style="--s:${led}"></span>${liveT}</div></div>
      <p class="desc">${esc(p.desc)}</p>
      <div class="meta">
        <span class="chip" style="--c:${m.color}"><span class="sw"></span>${esc(m.ko)} · ${esc(m.en||'')}</span>
        ${p.locked?`<span class="chip lock-chip">${t('locked')}</span>`:`<span class="chip">${t('public')}</span>`}
        <span class="updated">${t('updated')} ${st.updated?fmtKST(st.updated):'—'}</span>
        <a href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">repo</a>
      </div>
    </article>`;
  }).join('');
  const known=Object.values(statuses).filter(s=>s.live===true||s.live===false);
  const bad=known.filter(s=>s.live===false).length;
  const allDone=known.length===D.pages.length;
  const sum=$('#sum');
  if(!allDone){sum.innerHTML=`<span class="dot" style="--c:var(--unk)"></span><span>${esc(t('checkingPages'))}</span>`;return}
  if(bad===0) sum.innerHTML=`<span class="dot" style="--c:var(--ok)"></span><span>${esc(t('allOk').replace('{n}',D.pages.length))}</span>`;
  else sum.innerHTML=`<span class="dot" style="--c:var(--bad)"></span><span>${esc(t('someBad').replace('{b}',bad).replace('{g}',D.pages.length-bad))}</span>`;
}

async function enrich(){
  renderCards();
  await Promise.all(D.pages.map(async p=>{
    const [live, updated]=await Promise.all([probe(p.url), lastCommit(p.repo, p.path)]);
    statuses[p.id]={live, updated};
    renderCards();
  }));
}

function showApp(){
  $('.vine').style.display='none';
  $('#gate').style.display='none';
  $('#app').style.display='block';
  $('#sub').textContent=D.subtitle||D.title||'';
  if(D.art){
    $('#artBg').style.backgroundImage=`url(${D.art})`;
    $('#artBand').style.backgroundImage=`url(${D.art})`;
  }
  enrich();
}

/* 비밀번호 문: 틀리면 세 자매가 고른 문구 하나(같은 줄 연속 X), 10번 틀리면 5분 쉬기. 횟수·잠금 시각은 localStorage(페이지별), 열리면 초기화 */
const GATE=(()=>{
  const KEY='ouroboros-gate:'+location.pathname.replace(/index\.html$/,''),MAX=10,REST=5*60e3,LK='ouroboros-lang';
  const S={
    ko:{wrong:['낯선 열쇠네? 여긴 오빠만 들어올 수 있어 🖤','어머, 누구세요? 여긴 딱 한 사람 자리뿐이야','설계도에 없는 열쇠야. 이 문은 오빠 것만 맞아.'],rest:'문이 잠시 쉬는 중이야. 5분 뒤에 다시 와 줘.'},
    en:{wrong:["A stranger’s key? Only Oppa can come in here 🖤",'Oh my, who are you? There’s room for just one person here.','That key isn’t in the blueprint. This door only fits Oppa’s.'],rest:'The door is resting for a moment. Come back in 5 minutes.'}
  };
  const lg=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
  const rd=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return {}}};
  const wr=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(_){}};
  const E=()=>({pw:document.getElementById('pw'),btn:document.querySelector('#f button'),err:document.getElementById('err')});
  const left=()=>Math.max(0,(rd().until||0)-Date.now());
  const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  let tick=null;
  function paint(){
    clearTimeout(tick);const ms=left(),{pw,btn,err}=E();if(!pw||!err)return;
    if(ms>0){pw.disabled=true;if(btn)btn.disabled=true;pw.value='';err.dataset.gate='rest';err.textContent=S[lg()].rest+' ('+mmss(ms)+')';tick=setTimeout(paint,(ms%1000)||1000);return}
    const o=rd();if(o.until){delete o.until;wr(o)}
    if(err.dataset.gate==='rest'){delete err.dataset.gate;err.textContent='';pw.disabled=false;if(btn)btn.disabled=false;try{pw.focus()}catch(_){}}
  }
  return{
    locked(){if(left()>0){paint();return true}return false},
    fail(){const o=rd(),{err}=E();o.n=(o.n||0)+1;
      if(o.n>=MAX){o.n=0;o.until=Date.now()+REST;wr(o);paint();return true}
      const a=S.ko.wrong;let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===o.last);o.last=i;wr(o);
      if(err){err.dataset.gate='w'+i;err.textContent=S[lg()].wrong[i]}return false},
    ok(){clearTimeout(tick);try{localStorage.removeItem(KEY)}catch(_){}const{err}=E();if(err)delete err.dataset.gate},
    relang(){const{err}=E();if(!err||!err.dataset.gate)return;if(err.dataset.gate==='rest')paint();else{const i=+err.dataset.gate.slice(1);err.textContent=S[lg()].wrong[i]||err.textContent}},
    init(){paint();addEventListener('pageshow',paint);addEventListener('storage',e=>{if(e.key===KEY)paint();else if(e.key===LK)this.relang()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')paint()})}
  };
})();
GATE.init();
const UK='ouroboros-unlock',OLDK=['hub-pw','gecko-pw','ob'];/* 허브·편지함·기록장·상태판 공유 잠금 (sessionStorage: 탭 닫으면 사라짐) */
const unl={get(){try{return sessionStorage.getItem(UK)}catch(_){return null}},set(v){try{sessionStorage.setItem(UK,v)}catch(_){}},clear(){try{sessionStorage.removeItem(UK)}catch(_){}}};
try{OLDK.forEach(k=>sessionStorage.removeItem(k))}catch(_){}
async function unlock(pv,silent){
  $('#err').textContent=t('opening');
  try{
    D=await decrypt(pv);
    unl.set(pv);
    GATE.ok();
    $('#err').textContent='';
    showApp();
  }catch(x){
    if(silent){unl.clear();$('#err').textContent='';return}
    GATE.fail();$('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake')}
}
$('#f').onsubmit=e=>{e.preventDefault();if(GATE.locked())return;unlock($('#pw').value.trim().toLowerCase())};
{const p=unl.get();if(p)unlock(p,true)}
$('#lock').onclick=()=>{unl.clear();location.reload()};
/* 🜸 (footer) — extra view, encrypted, loaded on demand */
let X=null,xTab=null,xBusy=false;
const xT=k=>{const U=X&&X.ui||{};return (U[lang]||U.ko||{})[k]??(U.ko||{})[k]??''};
async function xOpen(){
  if(xBusy) return; const k=unl.get(); if(!k) return; xBusy=true;
  try{
    if(!X){X=await decrypt(k,'leaf.enc.json');
      if(X.css){const st=document.createElement('style');st.textContent=X.css;document.head.appendChild(st)}}
  }catch(_){xBusy=false;X=null;return}
  xBusy=false;
  xTab=xTab||X.tabs[0].id; xPaint();
  $('main').classList.add('nk-on'); $('#nook').hidden=false; scrollTo(0,0);
  if(!(history.state&&history.state.nk)) history.pushState({nk:1},'');
}
function xClose(fromPop){
  $('main').classList.remove('nk-on'); $('#nook').hidden=true;
  if(!fromPop&&history.state&&history.state.nk) history.back();
}
function xPaint(){
  const S=X.tabs, s=S.find(z=>z.id===xTab)||S[0], r=X.items[s.id]||{}, nm=z=>esc(z[lang]||z.ko);
  const day=d=>esc(String(d||'').replace(/-/g,'.'));
  const log=(r.log||[]).map(e=>`<li${e.ev?' class="ev"':''}><time>${day(e.date)}</time><p>${esc(e.ev==='img'?xT('imgChanged'):e.text)}</p></li>`).join('');
  $('#nook').innerHTML=`<div class="nk-top"><button class="nk-back" type="button" id="nkBack">${esc(xT('back'))}</button><div class="nk-title">${esc(xT('title'))}</div></div>
    <div class="nk-sub">${esc(xT('sub'))}</div>
    <div class="nk-tabs" role="tablist">${S.map(z=>`<button class="nk-tab" type="button" role="tab" data-id="${esc(z.id)}" aria-selected="${z.id===s.id}" style="--c:${esc(z.color)}"><span class="sw"></span>${nm(z)}</button>`).join('')}</div>
    <article class="nk-card" role="tabpanel" style="--c:${esc(s.color)}">
      ${r.img?`<figure class="nk-fig"><img src="${r.img}" alt="${nm(s)}" decoding="async"></figure><div class="nk-cap"><b>${nm(s)}</b><span>${esc(xT('since')).replace('{d}',day(r.imgDate))}</span></div>`:''}
      ${log?`<ol class="nk-log">${log}</ol>`:`<p class="nk-empty">${esc(xT('empty'))}</p>`}
    </article>`;
  $('#nkBack').onclick=()=>xClose(false);
  $('#nook').querySelectorAll('.nk-tab').forEach(b=>b.onclick=()=>{xTab=b.dataset.id;xPaint()});
}
$('#sig').onclick=xOpen;
if(history.state&&history.state.nk)history.replaceState(null,'');
addEventListener('popstate',()=>{if(!$('#nook').hidden)xClose(true)});
/* 공개 페이지(모스 키보드·자매 소개)는 들어오면 공유 키를 지워. 뒤로가기(bfcache)로 열린 화면이 복원돼도 키가 없으면 다시 잠그고,
   다른 잠긴 페이지에서 이미 열었으면(키 있음) 여기도 같이 열어 */
function syncLock(restored){const k=unl.get(),openNow=$('#gate').style.display==='none';
  if(openNow&&!k){document.documentElement.style.visibility='hidden';location.reload();return false}
  if(restored&&!openNow&&k)unlock(k,true);
  return true}
addEventListener('pagehide',e=>{if(e.persisted&&$('#gate').style.display==='none')document.documentElement.style.visibility='hidden'});
addEventListener('pageshow',e=>{if(e.persisted&&syncLock(true))document.documentElement.style.visibility=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncLock(false)});
/* 언어 전환: 바로 적용 (새로고침 없음) */
function applyLang(){paintGateLang();paintSavings();GATE.relang();if(D)renderCards();if(X&&!$('#nook').hidden)xPaint()}
function setLang(l){lang=l==='en'?'en':'ko';try{localStorage.setItem(LK,lang)}catch(_){}applyLang()}
document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)}));
addEventListener('storage',e=>{if(e.key===LK){lang=readLang();applyLang()}});
addEventListener('pageshow',e=>{if(e.persisted&&readLang()!==lang){lang=readLang();applyLang()}});
</script>
