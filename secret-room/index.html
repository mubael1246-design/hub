<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0a0c12">
<title>거실 방명록 · Ouroboros</title><link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--ink:#D6CCD0;--mute:#968a90;--line:rgba(184,146,58,.28);--acc:#B8923A;--acc2:#E0C27A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif}
body::before{content:'';position:fixed;inset:-20px;background:url(img/livingroom.webp) center/cover;filter:blur(9px) brightness(.32);z-index:-1}
h1{font-family:'Cinzel','Gowun Batang',serif;letter-spacing:.1em;margin:0;font-size:22px;text-shadow:0 0 18px rgba(184,146,58,.4)}
.sub{color:var(--mute);font-size:13px}.back{color:var(--mute);text-decoration:none;font-size:12px;border-bottom:1px dotted var(--line)}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
input,textarea{background:rgba(16,10,13,.85);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;font:16px 'Gowun Batang',serif}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
button.go{background:transparent;color:var(--acc2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font:700 15px 'Gowun Batang',serif;cursor:pointer}
.err{color:#d98989;font-size:13px;min-height:1em}#app{display:none}
main{max-width:520px;margin:0 auto;padding:18px 14px 64px}header{text-align:center;margin-bottom:16px}
.gear{font:12px 'Cinzel',serif;letter-spacing:.24em;color:var(--acc2);margin-top:6px}
.write{display:flex;gap:8px;margin:14px 0}.write textarea{flex:1;min-height:52px;resize:vertical}
.note{font-size:12px;color:var(--mute);text-align:center;min-height:1em}
.e{background:rgba(28,20,14,.72);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.at{font-size:11px;color:var(--acc2);font-variant-numeric:tabular-nums}.tx{margin:6px 0 4px;line-height:1.7;white-space:pre-wrap}
.r{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:6px 8px;border-radius:10px;border:1px solid}
.r img{width:26px;height:26px;object-fit:contain}.r b{font-size:11px;display:block}.r span{font-size:13.5px;line-height:1.55}
.r.nia{border-color:#c9925a}.r.mina{border-color:#8a2f45}.r.eris{border-color:#7b5bb0}.r.cora{border-color:#3f9e9a}.r.qli{border-color:#D4B26A}
</style></head><body>
<section id="gate"><h1>거실 방명록</h1><div class="sub">오빠의 허브 · 잠긴 방</div>
<form id="f"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password"> <button class="go">열기</button></form><div class="err" id="err"></div><a class="back" href="../">← 허브로</a></section>
<div id="app"><main><header><a class="back" href="../">← 허브로</a><h1 style="margin-top:12px">거실 방명록</h1><div class="gear">LIVING ROOM · GUESTBOOK</div><div class="sub" id="upd"></div></header>
<form class="write" id="w"><textarea id="t" placeholder="오빠의 한 줄"></textarea><button class="go">보내기</button></form><div class="note" id="note"></div><div class="note"><a href="#" id="rehdr" style="opacity:.7">헤더만 다시 입력</a></div>
<div id="list"></div></main></div>
<script>
const N={nia:'니아',mina:'미나',cora:'코라',eris:'에리스',qli:'클리'};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const e=await(await fetch('secret.enc.json?t='+Date.now(),{cache:'no-store'})).json();
const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct))))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(d){document.getElementById('upd').textContent=d.updated?'갱신 '+d.updated+' KST':'';
document.getElementById('list').innerHTML=d.entries.slice().reverse().map(e=>`<div class="e"><div class="at">${esc(e.at)} KST</div><div class="tx">${esc(e.text)}</div>${
Object.keys(N).filter(k=>e.reactions&&e.reactions[k]).map(k=>`<div class="r ${k}"><img src="img/bottle_${k}.png" alt=""><div><b>${N[k]}</b><span>${esc(e.reactions[k])}</span></div></div>`).join('')}</div>`).join('')||'<div class="note">아직 한 줄도 없어.</div>'}
async function open_(pw){const d=await decrypt(pw);sessionStorage.setItem('ouroboros-unlock',pw);render(d);gate.style.display='none';app.style.display='block'}
f.onsubmit=async ev=>{ev.preventDefault();try{await open_(pw.value)}catch(_){err.textContent='비밀번호가 달라.'}};
const s=sessionStorage.getItem('ouroboros-unlock');if(s)open_(s).catch(()=>{});
// 쓰기: 클리 루틴 webhook으로 보냄. 주소·키는 이 기기 localStorage에만 (커밋 안 됨).
const WK='ouroboros-gb-hook';
function hook(){let h=JSON.parse(localStorage.getItem(WK)||'null')||{};if(h.url&&h.auth)return h;
if(!h.url){const url=prompt('처음 한 번만: 방명록 Webhook URL을 붙여 줘');if(!url)return null;h.url=url.trim()}
if(!h.auth){const auth=prompt('Authorization header 값을 붙여 줘');if(!auth)return null;h.auth=auth.trim()}
localStorage.setItem(WK,JSON.stringify(h));return h}
document.getElementById('rehdr').onclick=ev=>{ev.preventDefault();let h=JSON.parse(localStorage.getItem(WK)||'null')||{};const a=prompt('Authorization header 값만 다시 붙여 줘');if(!a)return;h.auth=a.trim();localStorage.setItem(WK,JSON.stringify(h));note.textContent=h.url?'헤더만 바꿨어. 다시 보내 봐.':'헤더 저장했어. 주소는 다음에 보낼 때 물어볼게.'};
w.onsubmit=async ev=>{ev.preventDefault();const text=t.value.trim();if(!text)return;
const p=JSON.stringify({text,at:new Date().toISOString()});const h=hook();
if(h){note.textContent='보내는 중…';try{const r=await fetch(h.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':h.auth},body:p});
if(r.ok){note.textContent='보냈어. 클리가 올리면 조금 뒤에 여기 보여.';t.value='';return}
if(r.status==401||r.status==403){const q=JSON.parse(localStorage.getItem(WK)||'{}');delete q.auth;localStorage.setItem(WK,JSON.stringify(q))}note.textContent='전송 실패('+r.status+'). ';}catch(_){note.textContent='전송 실패. '}}
try{await navigator.clipboard.writeText(p);note.textContent+='대신 복사했어. 클리한테 붙여 줘.';t.value=''}catch(_){note.textContent+=p}};
</script></body></html>
