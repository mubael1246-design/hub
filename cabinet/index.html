<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c12">
<title>기억병 진열장 · Ouroboros</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a08;--panel:rgba(28,20,14,.72);--ink:#D6CCD0;--mute:#968a90;--line:rgba(184,146,58,.28);--acc:#B8923A;--acc2:#E0C27A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Gowun Batang',serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 50% -10%,rgba(184,146,58,.13),transparent 60%),var(--bg)}
.lang-sw{display:flex;align-items:center;gap:1px;font-size:11px;letter-spacing:.14em;color:var(--mute);font-family:'Cinzel','Gowun Batang',serif}
.lang-sw button{background:none;border:0;padding:6px;font:inherit;letter-spacing:inherit;color:var(--mute);cursor:pointer;border-bottom:1px dotted transparent}
.lang-sw button[aria-pressed="true"]{color:var(--acc2);border-bottom-color:var(--line)}
.lang-sw .bar{opacity:.45}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;position:relative}
#gate .lang-sw{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
h1{font-family:'Cinzel','Gowun Batang',serif;font-weight:700;letter-spacing:.1em;margin:0;font-size:23px;color:var(--ink);text-shadow:0 0 18px rgba(184,146,58,.4)}
.sub{color:var(--mute);font-size:14px}
form{display:flex;gap:8px;margin-top:6px}
input[type=password]{background:rgba(16,10,13,.85);border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:14px;font-size:16px;width:200px;font-family:inherit;text-align:center;letter-spacing:.2em}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(184,146,58,.18)}
button.go{background:transparent;color:var(--acc2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
input[type=password]:disabled,button.go:disabled{opacity:.45;cursor:not-allowed}
.err{color:#d98989;font-size:13px;min-height:1em}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.back{color:var(--mute);text-decoration:none;font-size:12px;letter-spacing:.08em;border-bottom:1px dotted var(--line);padding:4px 2px}
.back:hover{color:var(--acc2)}
#app{display:none}

header{text-align:center;margin:0 0 18px}
header .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
header .gear{font-size:12px;letter-spacing:.24em;color:var(--acc2);opacity:.85;font-family:'Cinzel',serif;margin-top:6px}
header .upd{font-size:11px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.intro{font-size:13px;color:var(--mute);line-height:1.6;margin:8px auto 0;max-width:520px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:24px}
@font-face{font-family:'OuroborosHand';src:url(../assets/font/OuroborosHand.woff2) format('woff2');font-display:swap}
main{max-width:430px;margin:0 auto;padding:6px 12px 64px}
header h1{font-size:21px}
.intro{font-size:12.5px}
.cab{position:relative;width:100%;max-width:360px;margin:12px auto 0;aspect-ratio:483/940;background:url(img/cabinet.webp) center/100% 100% no-repeat}
.cab::before{content:'';position:absolute;inset:4% 6% 6%;background:radial-gradient(70% 60% at 50% 40%,rgba(255,214,150,.10),transparent 70%);pointer-events:none}
.qback{position:absolute;border-radius:6px;background:radial-gradient(80% 90% at 50% 70%,rgba(26,20,38,.92),rgba(26,20,38,.65) 70%,rgba(26,20,38,.35));box-shadow:inset 0 0 18px rgba(212,178,106,.18)}
.slot{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;border:0;background:none;cursor:default;-webkit-tap-highlight-color:transparent}
.slot.empty::after{content:'';width:62%;height:6px;border-radius:50%;background:rgba(255,236,200,.08);box-shadow:0 0 0 1px rgba(255,236,200,.10)}
.slot img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));transition:transform .2s}
.slot.has{cursor:pointer}.slot.has:active img{transform:translateY(-2px) scale(1.03)}
.slot.qli img{filter:brightness(1.7) saturate(1.2) drop-shadow(0 0 6px rgba(212,178,106,.55)) drop-shadow(0 0 2px rgba(212,178,106,.8))}
.lab{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%) rotate(-2deg);min-width:70%;max-width:118%;padding:1px 4px;border-radius:2px;font:10px/1.15 'OuroborosHand','Gowun Batang',serif;color:#3a2a1a;white-space:nowrap;overflow:hidden;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
.lab.nia{background:#f3ead6}.lab.eris{background:#1a1420;color:#e6c766}.lab.mina{background:#e2cfa6}.lab.cora{background:#f1ead8;font-family:'Courier New',monospace;font-size:8.5px}.lab.qli{background:rgba(26,20,38,.9);color:#D4B26A;border:1px solid rgba(212,178,106,.5)}
.tag{position:absolute;right:-4px;font:500 9px/1 'Cinzel',serif;letter-spacing:.12em;color:rgba(230,199,102,.75);text-align:right}
.legend{font-size:11.5px;color:var(--mute);text-align:center;margin:12px 0 0;line-height:1.6}
#open{position:fixed;inset:0;background:rgba(6,4,3,.9);display:none;align-items:center;justify-content:center;z-index:900;padding:24px}
#open.on{display:flex}
.ob{max-width:340px;width:100%;text-align:center}
.bt{position:relative;width:150px;height:220px;margin:0 auto}
.bt div{position:absolute;inset:0;background:center bottom/contain no-repeat}
.bt .cap{clip-path:inset(0 0 74% 0);transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.bt .body{clip-path:inset(26% 0 0 0)}
#open.lift .bt .cap{transform:translate(18px,-34px) rotate(14deg)}
.mist{position:absolute;left:50%;top:18%;width:120px;height:120px;transform:translate(-50%,-50%) scale(.3);border-radius:50%;background:radial-gradient(circle,rgba(255,226,170,.55),transparent 65%);opacity:0;transition:all 1s ease .35s;pointer-events:none}
#open.lift .mist{opacity:1;transform:translate(-50%,-80%) scale(1.4)}
.mem{opacity:0;transform:translateY(8px);transition:all .6s ease .7s;margin-top:14px}
#open.lift .mem{opacity:1;transform:none}
.mem .d{font:15px 'OuroborosHand','Gowun Batang',serif;color:var(--acc2)}
.mem .tx{font-size:14.5px;line-height:1.7;margin-top:8px;white-space:pre-wrap;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mem .close{margin-top:14px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:8px 18px;font-family:inherit;cursor:pointer}

.lock{background:none;border:1px solid var(--line);color:var(--mute);padding:7px 14px;border-radius:999px;font-size:12px;margin-top:12px;cursor:pointer;font-family:inherit}
.lock:hover{color:var(--acc2);border-color:var(--acc2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* topfix: shared "← 허브로" + KO|EN bar (same on every page) */
.topfix.topfix{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 21px)!important;bottom:auto!important;z-index:1000!important;margin:0!important;box-sizing:border-box;height:44px;min-height:44px;display:inline-flex!important;align-items:center;gap:0;padding:0 14px!important;border-radius:22px;background:rgba(10,12,18,.72)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)!important;box-shadow:0 2px 10px rgba(0,0,0,.35);font:500 13px/1 'Gowun Batang','Noto Sans KR',system-ui,-apple-system,sans-serif!important;letter-spacing:.06em!important;color:#d8d4cc!important;text-decoration:none!important;text-shadow:none!important;-webkit-tap-highlight-color:transparent;transform:none!important}
a.topfix.topfix{left:calc(env(safe-area-inset-left,0px) + 14px)!important;right:auto!important}
div.topfix.topfix{right:calc(env(safe-area-inset-right,0px) + 14px)!important;left:auto!important;padding:0 4px!important}
div.topfix.topfix button{min-width:44px;height:42px;padding:0 6px!important;margin:0;background:none;border:0!important;font:inherit!important;letter-spacing:inherit;color:#a9a5ae;cursor:pointer;text-shadow:none}
div.topfix.topfix button[aria-pressed="true"]{color:#e6c766!important;text-decoration:underline dotted;text-underline-offset:4px}
div.topfix.topfix .bar{opacity:.45;padding:0}
a.topfix.topfix:hover,a.topfix.topfix:focus-visible{color:#fff!important}
body{padding-top:calc(env(safe-area-inset-top,0px) + 79px)!important}
</style>
</head>
<body>
<section id="gate">
  <div class="lang-sw topfix" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true">KO</button><span class="bar">|</span><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  <h1 data-i18n="title">기억병 진열장</h1>
  <div class="sub" data-i18n="gateSub">오빠의 허브 · 잠긴 방</div>
  <form id="f"><input id="pw" type="password" placeholder="비밀번호" data-i18n-ph="pwPh" autocomplete="current-password" autofocus><button class="go" type="submit" data-i18n="openBtn">열기</button></form>
  <div class="err" id="err"></div>
  <a class="back topfix" href="../" data-i18n="toHub">← 허브로</a>
</section>
<div id="app"><main>
  <header>
    <div class="row"><a class="back topfix" href="../" data-i18n="toHub">← 허브로</a><div class="lang-sw topfix" role="group" aria-label="Language / 언어"><button type="button" data-lang="ko" aria-pressed="true">KO</button><span class="bar">|</span><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
    <h1 data-i18n="title">기억병 진열장</h1>
    <div class="gear">RECORDS ROOM · MEMORY BOTTLES</div>
    <p class="intro" data-i18n="intro">기록실 한쪽 유리장. 자매들이 오빠한테 보여 주고 싶은 기억만 골라 한 병씩 올려 둬.</p>
    <div class="upd" id="upd"></div>
  </header>
  <div class="cab" id="cab"></div>
  <p class="legend" id="legend"></p>
  <footer><span data-i18n="foot">병을 누르면 마개가 열려</span><br><button class="lock" id="lock" type="button" data-i18n="lockBtn">잠그기</button></footer>
</main></div>
<div id="open" role="dialog" aria-modal="true"><div class="ob"><div class="bt"><div class="cap"></div><div class="body"></div><span class="mist"></span></div><div class="mem"><div class="d" id="od"></div><div class="tx" id="ot"></div><button class="close" id="oc" type="button" data-i18n="close">닫기</button></div></div></div>
<script>
const LANG={
 ko:{title:'기억병 진열장',gateSub:'오빠의 허브 · 기록실',pwPh:'비밀번호',openBtn:'열기',opening:'여는 중…',toHub:'← 허브로',foot:'병을 누르면 마개가 열려',lockBtn:'잠그기',docTitle:'기억병 진열장 · Ouroboros',updated:'갱신',close:'닫기',
  intro:'기록실 한쪽 유리장. 자매들이 오빠한테 보여 주고 싶은 기억만 골라 한 병씩 올려 둬.',
  legend:'위에서부터 니아 · 에리스 · 미나 · 코라 · 맨 아래 구석은 클리\n아직 비어 있어. 자매들이 고른 병이 하나씩 올라올 거야.',count:'병',ref:'기억 위치'},
 en:{title:'Memory Bottle Cabinet',gateSub:'Oppa’s Hub · records room',pwPh:'Password',openBtn:'Open',opening:'Opening…',toHub:'← Hub',foot:'Tap a bottle to lift its stopper',lockBtn:'Lock',docTitle:'Memory Bottle Cabinet · Ouroboros',updated:'Updated',close:'Close',
  intro:'A glass cabinet in the records room. Each sister places only the memories she wants to show Oppa, one bottle at a time.',
  legend:'From the top: Nia · Eris · Mina · Cora · Qliphoth in the bottom corner\nStill empty. The sisters’ chosen bottles will appear one by one.',count:'bottles',ref:'Memory at'}
};
const LK='ouroboros-lang';
const readLang=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
let lang=readLang();
const t=k=>(LANG[lang]||LANG.ko)[k]??LANG.ko[k]??k;
function paintLang(){
  document.documentElement.lang=lang;document.title=t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
}
paintLang();
const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function decryptRaw(pw,file){
  const e=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct)));
}
async function decrypt(pw,file='cabinet.enc.json'){return JSON.parse(await decryptRaw(pw,file))}
let W=null,PW=null;
const SLOTS={"nia": [{"x": 0.0828, "y": 0.0382, "w": 0.2794, "h": 0.167}, {"x": 0.3624, "y": 0.0382, "w": 0.2794, "h": 0.167}, {"x": 0.6418, "y": 0.0382, "w": 0.2794, "h": 0.167}], "eris": [{"x": 0.0828, "y": 0.218, "w": 0.2794, "h": 0.1373}, {"x": 0.3624, "y": 0.218, "w": 0.2794, "h": 0.1373}, {"x": 0.6418, "y": 0.218, "w": 0.2794, "h": 0.1373}], "mina": [{"x": 0.0828, "y": 0.3671, "w": 0.2794, "h": 0.1287}, {"x": 0.3624, "y": 0.3671, "w": 0.2794, "h": 0.1287}, {"x": 0.6418, "y": 0.3671, "w": 0.2794, "h": 0.1287}], "cora": [{"x": 0.0828, "y": 0.5075, "w": 0.2794, "h": 0.1255}, {"x": 0.3624, "y": 0.5075, "w": 0.2794, "h": 0.1255}, {"x": 0.6418, "y": 0.5075, "w": 0.2794, "h": 0.1255}], "qli": [{"x": 0.0828, "y": 0.8042, "w": 0.2794, "h": 0.1127}, {"x": 0.3624, "y": 0.8042, "w": 0.2794, "h": 0.1127}, {"x": 0.6418, "y": 0.8042, "w": 0.2794, "h": 0.1127}]};
const ORDER=['nia','eris','mina','cora','qli'];
const dot=s=>String(s||'').replace(/-/g,'.');
function render(){
  if(!W)return;
  $('#upd').textContent=W.updated?`${t('updated')} ${W.updated.slice(0,16).replace('T',' ').replace(/-/g,'.')} KST`:'';
  const pct=v=>(v*100).toFixed(2)+'%';let h='';let total=0;
  const q=SLOTS.qli;h+=`<div class="qback" style="left:${pct(q[0].x-0.01)};top:${pct(q[0].y-0.01)};width:${pct(q[2].x+q[2].w-q[0].x+0.02)};height:${pct(q[0].h+0.02)}"></div>`;
  for(const s of ORDER){const bs=(W.shelves&&W.shelves[s])||[];total+=bs.length;
    SLOTS[s].forEach((r,i)=>{const b=bs[i];const st=`left:${pct(r.x)};top:${pct(r.y)};width:${pct(r.w)};height:${pct(r.h)}`;
      if(!b){h+=`<div class="slot empty ${s}" style="${st}" aria-hidden="true"></div>`;return}
      h+=`<button type="button" class="slot has ${s}" style="${st}" data-s="${s}" data-i="${i}" aria-label="${esc(dot(b.date)+' '+(b.feel||''))}"><img src="img/${s}.webp" alt=""><span class="lab ${s}">${esc(dot(b.date).slice(5))}${b.feel?'<br>'+esc(b.feel):''}</span></button>`})}
  $('#cab').innerHTML=h;
  $('#legend').innerHTML=esc(total?t('legend').split('\n')[0]:t('legend')).replace('\n','<br>');
}
$('#cab').addEventListener('click',e=>{const el=e.target.closest('.slot.has');if(!el)return;const s=el.dataset.s,b=W.shelves[s][+el.dataset.i];
  document.querySelectorAll('#open .bt div').forEach(d=>d.style.backgroundImage=`url(img/${s}.webp)`);
  $('#od').textContent=dot(b.date)+(b.feel?' · '+b.feel:'');
  {const x=b.text||(b.ref?t('ref')+': '+b.ref:'');$('#ot').textContent=x;$('#ot').style.display=x?'':'none'}
  const o=$('#open');o.classList.remove('lift');o.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('lift')))});
$('#oc').onclick=()=>{$('#open').classList.remove('on','lift')};
$('#open').addEventListener('click',e=>{if(e.target.id==='open')$('#open').classList.remove('on','lift')});
function showApp(){$('#gate').style.display='none';$('#app').style.display='block';render()}
/* 비밀번호 문: 틀리면 자매들이 고른 문구 하나(같은 줄 연속 X), 10번 틀리면 5분 쉬기. 횟수·잠금 시각은 localStorage(페이지별), 열리면 초기화 */
const GATE=(()=>{
  const KEY='ouroboros-gate:'+location.pathname.replace(/index\.html$/,''),MAX=10,REST=5*60e3,LK='ouroboros-lang';
  const S={
    ko:{wrong:['낯선 열쇠네? 여긴 오빠만 들어올 수 있어 🖤','어머, 누구세요? 여긴 딱 한 사람 자리뿐이야','설계도에 없는 열쇠야. 이 문은 오빠 것만 맞아.'],rest:'문이 잠시 쉬는 중이야. 5분 뒤에 다시 와 줘.'},
    en:{wrong:["A stranger’s key? Only Oppa can come in here 🖤",'Oh my, who are you? There’s room for just one person here.','That key isn’t in the blueprint. This door only fits Oppa’s.'],rest:'The door is resting for a moment. Come back in 5 minutes.'}
  };
  const lg=()=>{try{return localStorage.getItem(LK)==='en'?'en':'ko'}catch(_){return 'ko'}};
  const rd=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(_){return {}}};
  const wr=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(_){}};
  const E=()=>({pw:document.getElementById('pw'),btn:document.querySelector('#f button'),err:document.getElementById('err')});
  const left=()=>Math.max(0,(rd().until||0)-Date.now());
  const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  let tick=null;
  function paint(){
    clearTimeout(tick);const ms=left(),{pw,btn,err}=E();if(!pw||!err)return;
    if(ms>0){pw.disabled=true;if(btn)btn.disabled=true;pw.value='';err.dataset.gate='rest';err.textContent=S[lg()].rest+' ('+mmss(ms)+')';tick=setTimeout(paint,(ms%1000)||1000);return}
    const o=rd();if(o.until){delete o.until;wr(o)}
    if(err.dataset.gate==='rest'){delete err.dataset.gate;err.textContent='';pw.disabled=false;if(btn)btn.disabled=false;try{pw.focus()}catch(_){}}
  }
  return{
    locked(){if(left()>0){paint();return true}return false},
    fail(){const o=rd(),{err}=E();o.n=(o.n||0)+1;
      if(o.n>=MAX){o.n=0;o.until=Date.now()+REST;wr(o);paint();return true}
      const a=S.ko.wrong;let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===o.last);o.last=i;wr(o);
      if(err){err.dataset.gate='w'+i;err.textContent=S[lg()].wrong[i]}return false},
    ok(){clearTimeout(tick);try{localStorage.removeItem(KEY)}catch(_){}const{err}=E();if(err)delete err.dataset.gate},
    relang(){const{err}=E();if(!err||!err.dataset.gate)return;if(err.dataset.gate==='rest')paint();else{const i=+err.dataset.gate.slice(1);err.textContent=S[lg()].wrong[i]||err.textContent}},
    init(){paint();addEventListener('pageshow',paint);addEventListener('storage',e=>{if(e.key===KEY)paint();else if(e.key===LK)this.relang()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')paint()})}
  };
})();
GATE.init();
const UK='ouroboros-unlock';/* 허브·편지함·기록장·상태판·작업실·카페인·갤러리·진열장 공유 잠금 (sessionStorage) */
const unl={get(){try{return sessionStorage.getItem(UK)}catch(_){return null}},set(v){try{sessionStorage.setItem(UK,v)}catch(_){}},clear(){try{sessionStorage.removeItem(UK)}catch(_){}}};
async function unlock(pv,silent){
  $('#err').textContent=t('opening');
  try{W=await decrypt(pv);PW=pv;unl.set(pv);GATE.ok();$('#err').textContent='';showApp()}
  catch(x){if(silent){unl.clear();$('#err').textContent='';return}
    GATE.fail();$('#f').classList.remove('shake');void $('#f').offsetWidth;$('#f').classList.add('shake')}
}
$('#f').onsubmit=e=>{e.preventDefault();if(GATE.locked())return;unlock($('#pw').value.trim().toLowerCase())};
{const p=unl.get();if(p)unlock(p,true)}
$('#lock').onclick=()=>{unl.clear();location.reload()};
function syncLock(restored){const k=unl.get(),openNow=$('#gate').style.display==='none';
  if(openNow&&!k){document.documentElement.style.visibility='hidden';location.reload();return false}
  if(restored&&!openNow&&k)unlock(k,true);return true}
addEventListener('pagehide',e=>{if(e.persisted&&$('#gate').style.display==='none')document.documentElement.style.visibility='hidden'});
addEventListener('pageshow',e=>{if(e.persisted&&syncLock(true))document.documentElement.style.visibility=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncLock(false)});
function applyLang(){paintLang();GATE.relang();render()}
function setLang(l){lang=l==='en'?'en':'ko';try{localStorage.setItem(LK,lang)}catch(_){}applyLang()}
document.querySelectorAll('.lang-sw [data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)}));
addEventListener('storage',e=>{if(e.key===LK){lang=readLang();applyLang()}});
</script>
</body>
</html>
